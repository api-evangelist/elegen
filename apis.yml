aid: elegen
name: Elegen
description: >-
  Elegen is a synthetic biology company founded in 2017 and headquartered in
  Menlo Park, California that manufactures high-accuracy synthetic DNA through
  its proprietary cell-free ENFINIA platform. Rather than relying on traditional
  cell-based cloning, ENFINIA combines microfluidics, artificial intelligence,
  and robotics to produce long, clonal-quality, high-complexity DNA at speed and
  low cost. The ENFINIA product line includes Linear DNA up to 7 kb delivered in
  6-8 business days, Plasmid DNA up to 15 kb, and IVT Ready DNA with encoded
  poly(A) tails for mRNA workflows, each NGS-verified to 99.999% per-base
  accuracy. Elegen serves researchers and therapeutics developers across mRNA
  vaccines, cell and gene therapy, CRISPR genome editing, and protein
  expression. Customers submit and order sequences through the online ENFINIA
  ordering portal; Elegen does not currently publish a public developer API.
  The company is backed by a16z Bio + Health, KdT Ventures, 8VC, Digitalis
  Ventures, Agilent, and others, and raised a $35M Series B in 2024.
